<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <meta name="theme-color" content="#0f1115" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="LifePlanner OS - Personal Operating System that eliminates decision fatigue. 100% offline, no tracking." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifePlanner" />
    <title>LifePlanner OS</title>
    <style>
      /* Initial loader to avoid FOUC and show something before React boots */
      #initial-loader {
        position: fixed;
        inset: 0;
        background: #0f1115;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: white;
        font-family: system-ui, -apple-system, sans-serif;
        transition: opacity 0.3s ease;
      }
      #initial-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #initial-loader.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="spinner"></div>
      <div style="font-weight:600; letter-spacing: -0.02em;">LifePlanner OS</div>
      <div style="font-size:12px; color:#71717a; margin-top:8px;">Booting...</div>
      <noscript>
        <div style="margin-top:24px; text-align:center; max-width:300px; font-size:14px; color:#a1a1aa;">
          JavaScript is required to run LifePlanner OS. Please enable JavaScript in your browser.
        </div>
      </noscript>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Fallback if React fails to boot within 10 seconds - show recovery
      setTimeout(function() {
        var loader = document.getElementById('initial-loader');
        var root = document.getElementById('root');
        if (loader && root && root.innerHTML === '') {
          loader.innerHTML = '<div style="text-align:center; padding:24px; max-width:400px;">' +
            '<h2 style="font-size:20px; font-weight:bold; margin-bottom:8px;">App not loading?</h2>' +
            '<p style="color:#a1a1aa; font-size:14px; margin-bottom:16px;">This usually means cached files are stale or storage is blocked.</p>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); if(window.indexedDB){indexedDB.deleteDatabase(\'LifePlannerDB\')} location.reload()" style="background:white; color:black; border:none; padding:12px 24px; border-radius:12px; font-weight:600; cursor:pointer; width:100%; margin-bottom:8px;">Clear Cache & Reload</button>' +
            '<button onclick="location.reload()" style="background:#27272a; color:white; border:none; padding:12px 24px; border-radius:12px; font-weight:600; cursor:pointer; width:100%;">Just Reload</button>' +
            '<p style="color:#52525b; font-size:11px; margin-top:16px;">If on iPhone Private Mode, use normal tab. Enable JavaScript.</p>' +
            '</div>';
        }
      }, 10000);
    </script>
  </body>
</html>
